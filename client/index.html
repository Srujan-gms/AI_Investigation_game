<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Mystery Room — Detective Investigation Experience</title>
  <meta name="description" content="Immersive AI-powered noir murder mystery room. Inspect crime scenes, cross-examine suspects, decode WhatsApp leaks, and identify the killer." />
  <meta name="referrer" content="no-referrer" />

  <!-- Google Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/css/variables.css" />
  <link rel="stylesheet" href="/src/css/animations.css" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <!-- Ambient Atmospheric Particle Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <!-- Celebratory Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Top App Navigation -->
  <header class="app-navbar">
    <div class="nav-brand" id="nav-brand">
      <div class="brand-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <div class="brand-title">MYSTERY<span>ROOM</span></div>
    </div>

    <div class="nav-actions">
      <div class="token-pill" id="nav-hint-tokens">3 HINTS</div>
      <button class="nav-btn" id="nav-cases-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>
        Case Archives
      </button>
      <button class="nav-btn" id="nav-new-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New Mystery
      </button>
      <div class="user-badge" id="nav-user-badge" title="Open Detective Dossier & Account Settings">
        <div class="user-badge-status-dot" id="nav-user-status-dot"></div>
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80" alt="Avatar" class="user-avatar" id="nav-user-avatar" />
        <span id="user-badge-name">Detective Vance</span>
      </div>
    </div>
  </header>

  <!-- Main View Container (Controlled by SPA Router) -->
  <main id="app"></main>

  <!-- Floating Sticky Detective Notes Button & Modal -->
  <button class="notes-drawer-btn" id="notes-drawer-btn" title="Open Detective Scratchpad">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    Detective Notes
  </button>

  <div class="notes-drawer-modal" id="notes-drawer-modal">
    <div class="notes-drawer-header">
      <div style="font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; color: var(--color-accent-amber); display: flex; align-items: center; gap: 0.5rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        DETECTIVE SCRATCHPAD
      </div>
      <button id="notes-close-btn" style="background: none; border: none; color: var(--color-text-muted); cursor: pointer; font-size: 1.2rem;">&times;</button>
    </div>
    <textarea class="notes-textarea" id="notes-textarea" placeholder="Record your observations, suspect discrepancies, timeline gaps, and deductions here... (auto-saves)"></textarea>
  </div>

  <!-- Accusation Modal -->
  <div class="modal-backdrop" id="accusation-modal">
    <div class="accusation-modal-box">
      <h2 class="accusation-title">FORMAL ACCUSATION</h2>
      <p class="accusation-subtext">
        Select the primary suspect you believe orchestrated the murder. Review their statements carefully before lodging the official indictment.
      </p>

      <div class="suspect-pick-grid" id="suspect-pick-grid">
        <!-- Rendered dynamically -->
      </div>

      <div style="display: flex; justify-content: center; gap: 1rem;">
        <button class="btn btn-secondary" id="accusation-close-btn">Continue Investigating</button>
        <button class="btn btn-primary" id="accusation-confirm-btn" style="padding: 0.75rem 2.25rem;">
          Submit Final Verdict
        </button>
      </div>
    </div>
  </div>

  <!-- Forensic Image Lightbox Modal -->
  <div class="lightbox-modal" id="lightbox-modal">
    <button id="lightbox-close-btn" style="position: absolute; top: 24px; right: 28px; background: none; border: none; color: #fff; font-size: 2.5rem; cursor: pointer;">&times;</button>
    <div class="lightbox-content">
      <img src="" alt="Forensic Inspection" id="lightbox-img" class="lightbox-img" />
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
